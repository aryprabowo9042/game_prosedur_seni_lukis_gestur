<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Kelompok PID - Prosedur Berkarya Seni Lukis</title>

  <!-- Import MediaPipe Vision -->
  <script type="module">
    import {
      PoseLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";
    window.PoseLandmarker = PoseLandmarker;
    window.FilesetResolver = FilesetResolver;
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Header Bar */
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 25px; background: #1e1e1e; border-bottom: 2px solid #333; z-index: 10; }
    h1 { font-size: 22px; color: #f39c12; }
    .timer-board { font-size: 20px; font-weight: bold; background: #2a2a2a; padding: 6px 16px; border-radius: 8px; color: #e74c3c; }

    /* Container Utama Kuis */
    .quiz-container { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 15px; position: relative; }
    .question-box { background: rgba(37, 37, 37, 0.95); border: 2px solid #f39c12; border-radius: 12px; padding: 12px 25px; width: 95%; text-align: center; margin-bottom: 12px; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .question-text { font-size: 22px; font-weight: 600; color: #ffffff; }

    /* ZONA JAWABAN BERBASIS BACKGROUND KAMERA */
    .zones-container { display: flex; width: 100%; flex: 1; gap: 0; position: relative; margin-bottom: 10px; border-radius: 16px; overflow: hidden; border: 3px solid #f39c12; }
    
    /* KAMERA BACKGROUND */
    .camera-bg-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    /* OVERLAY ZONA JAWABAN KIRI & KANAN */
    .zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px; z-index: 2; transition: all 0.3s ease; }
    .zone-left { background: rgba(231, 76, 60, 0.25); } 
    .zone-right { background: rgba(46, 204, 113, 0.25); } 

    .zone-title { font-size: 38px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
    .zone-left .zone-title { color: #ff6b6b; }
    .zone-right .zone-title { color: #2ecc71; }

    /* GARIS PEMISAH DI TENGAH LAYAR */
    .screen-divider { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: repeating-linear-gradient(to bottom, #f39c12 0, #f39c12 15px, transparent 15px, transparent 30px); transform: translateX(-50%); z-index: 3; }
    .divider-label { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #f39c12; color: #000; font-weight: bold; padding: 4px 14px; border-radius: 12px; font-size: 12px; z-index: 3; }

    /* CANVAS TITIK PENANDA */
    #output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

    /* COUNTER CARD */
    .counter-card { background: rgba(0, 0, 0, 0.75); padding: 10px 30px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
    .counter-number { font-size: 46px; font-weight: bold; }
    .zone-left .counter-number { color: #ff6b6b; }
    .zone-right .counter-number { color: #2ecc71; }
    .counter-label { font-size: 14px; color: #eee; }

    /* Footer & Tombol Aktifkan Kamera */
    .footer-bar { display: flex; width: 100%; justify-content: center; align-items: center; gap: 15px; z-index: 10; }
    .status-msg { background: rgba(0,0,0,0.85); padding: 8px 20px; border-radius: 20px; font-size: 15px; color: #f1c40f; border: 1px solid #f39c12; }
    
    .btn-camera { background: #27ae60; color: #fff; font-weight: bold; font-size: 16px; padding: 8px 20px; border: none; border-radius: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: 0.2s; }
    .btn-camera:hover { background: #219150; scale: 1.05; }

    /* Modal Hasil & Rekapitulasi */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); justify-content: center; align-items: center; z-index: 20; }
    .modal-content { background: #222; padding: 25px 35px; border-radius: 16px; text-align: center; max-width: 650px; border: 2px solid #f39c12; width: 90%; }
    .modal-content h2 { font-size: 28px; color: #f39c12; margin-bottom: 12px; }
    
    /* Rekapitulasi Table Style */
    .rekap-table { width: 100%; margin-bottom: 15px; border-collapse: collapse; text-align: left; font-size: 14px; }
    .rekap-table th { background: #333; color: #f39c12; padding: 8px; border: 1px solid #444; }
    .rekap-table td { padding: 6px 8px; border: 1px solid #444; background: #1e1e1e; }
    .rekap-table tr:nth-child(even) td { background: #252525; }

    .btn-group { display: flex; gap: 15px; justify-content: center; }
    .btn-action { padding: 10px 22px; font-size: 16px; border: none; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .btn-next { background: #f39c12; }
    .btn-restart { background: #27ae60; }
  </style>
</head>
<body>

  <header>
    <h1>🎨 Kuis Kelompok PID: Prosedur Berkarya Seni Lukis</h1>
    <div class="timer-board">Waktu: <span id="timer">15</span> dtk</div>
  </header>

  <div class="quiz-container">
    <div class="question-box">
      <div id="question" class="question-text">Klik tombol "Mulai / Aktifkan Kamera" di bawah untuk memulai.</div>
    </div>

    <div class="zones-container" id="zones-wrapper">
      <div class="camera-bg-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
      </div>

      <div class="screen-divider"></div>
      <div class="divider-label">GARIS BATAS</div>

      <div id="zone-left" class="zone zone-left">
        <div class="zone-title">SALAH</div>
        <div class="counter-card">
          <div id="count-left" class="counter-number">0</div>
          <div class="counter-label">Siswa di Sisi Kiri</div>
        </div>
      </div>

      <div id="zone-right" class="zone zone-right">
        <div class="zone-title">BENAR</div>
        <div class="counter-card">
          <div id="count-right" class="counter-number">0</div>
          <div class="counter-label">Siswa di Sisi Kanan</div>
        </div>
      </div>

      <canvas id="output_canvas"></canvas>
    </div>

    <div class="footer-bar">
      <button id="btn-start-cam" class="btn-camera" onclick="initMediaPipe()">📷 Mulai / Aktifkan Kamera</button>
      <div id="status" class="status-msg">Silakan aktifkan kamera terlebih dahulu.</div>
    </div>
  </div>

  <!-- Modal Evaluasi Per Soal & Rekap Akhir -->
  <div id="modal-result" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">Waktu Habis! ⏱️</h2>
      <div id="modal-body">
        <p id="modal-desc">Memproses hasil pilihan kelompok...</p>
      </div>
      <div class="btn-group">
        <button id="btn-next" class="btn-action btn-next" onclick="nextQuestion()">Lanjut Soal Berikutnya</button>
        <button id="btn-restart" class="btn-action btn-restart" onclick="restartQuiz()" style="display: none;">Ulangi Kuis Dari Awal 🔄</button>
      </div>
    </div>
  </div>

  <script>
    // Data Soal Materi Prosedur Berkarya Seni Lukis
    const questions = [
      { q: "Pernyataan: 'Langkah pertama dalam berkarya seni lukis adalah memunculkan gagasan atau ide ide lukisan.'", a: "BENAR" },
      { q: "Pernyataan: 'Membuat sketsa awal (sketch) dilakukan setelah proses penyempurnaan atau pewarnaan akhir.'", a: "SALAH" },
      { q: "Pernyataan: 'Teknik Plakat menggunakan cat dengan sapuan tipis transparan sehingga latar belakang kain/kertas masih terlihat.'", a: "SALAH" },
      { q: "Pernyataan: 'Proses pencampuran warna dan pencahayaan (gelap-terang) dilakukan pada tahap pewarnaan lukisan.'", a: "BENAR" },
      { q: "Pernyataan: 'Tahap penyempurnaan (finishing) meliputi pemberian detail objek, penegasan garis, dan pengeringan lukisan.'", a: "BENAR" }
    ];

    let currentQ = 0;
    let poseLandmarker;
    let webcamElement = document.getElementById("webcam");
    let canvasElement = document.getElementById("output_canvas");
    let canvasCtx = canvasElement.getContext("2d");

    let isTimerActive = false; 
    let timeLeft = 15;
    let timerInterval = null;

    let currentLeftCount = 0;
    let currentRightCount = 0;
    let rekapData = [];

    // 1. Inisialisasi MediaPipe setelah tombol diklik
    async function initMediaPipe() {
      const status = document.getElementById("status");
      const btnCam = document.getElementById("btn-start-cam");
      
      status.innerText = "Memuat AI Pose Landmarker...";
      btnCam.style.display = "none";

      try {
        const vision = await window.FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
        );

        poseLandmarker = await window.PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numPoses: 20
        });

        status.innerText = "Kamera Aktif! Berdirilah di Sisi Kanan (BENAR) atau Kiri (SALAH).";
        startCamera();
      } catch (err) {
        status.innerText = "Gagal memuat kamera/MediaPipe: " + err.message;
        btnCam.style.display = "inline-block";
      }
    }

    // 2. Aktifkan Kamera & Penyesuaian Canvas
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } } });
        webcamElement.srcObject = stream;
        webcamElement.addEventListener("loadeddata", () => {
          resizeCanvas();
          window.addEventListener("resize", resizeCanvas);
          requestAnimationFrame(predictWebcam);
          showQuestion();
        });
      } catch (err) {
        document.getElementById("status").innerText = "Akses Kamera Ditolak. Izinkan akses kamera di browser PID Anda.";
      }
    }

    function resizeCanvas() {
      const wrapper = document.getElementById("zones-wrapper");
      canvasElement.width = wrapper.clientWidth;
      canvasElement.height = wrapper.clientHeight;
    }

    // 3. Loop Deteksi Real-Time Utama
    function predictWebcam() {
      if (webcamElement.readyState >= 2 && poseLandmarker) {
        const timestamp = performance.now();
        const results = poseLandmarker.detectForVideo(webcamElement, timestamp);
        
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        // Garis Pemisah Kamera di Tengah
        canvasCtx.strokeStyle = "#f39c12";
        canvasCtx.lineWidth = 4;
        canvasCtx.setLineDash([8, 8]);
        canvasCtx.beginPath();
        canvasCtx.moveTo(canvasElement.width / 2, 0);
        canvasCtx.lineTo(canvasElement.width / 2, canvasElement.height);
        canvasCtx.stroke();
        canvasCtx.setLineDash([]);

        processPosesAndDraw(results);
      }
      requestAnimationFrame(predictWebcam);
    }

    // 4. Hitung & Gambar Titik Penanda
    function processPosesAndDraw(results) {
      let leftCount = 0;
      let rightCount = 0;

      if (results.landmarks && results.landmarks.length > 0) {
        const vw = webcamElement.videoWidth || 1280;
        const vh = webcamElement.videoHeight || 720;
        const cw = canvasElement.width;
        const ch = canvasElement.height;

        const videoRatio = vw / vh;
        const canvasRatio = cw / ch;

        let renderW, renderH, xOffset, yOffset;

        if (canvasRatio > videoRatio) {
          renderW = cw;
          renderH = cw / videoRatio;
          xOffset = 0;
          yOffset = (renderH - ch) / 2;
        } else {
          renderH = ch;
          renderW = ch * videoRatio;
          xOffset = (renderW - cw) / 2;
          yOffset = 0;
        }

        results.landmarks.forEach(person => {
          const rawX = person[0].x;
          const rawY = person[0].y;

          // Mirroring Sumbu X
          const mirroredX = 1 - rawX;

          const px = (mirroredX * renderW) - xOffset;
          const py = (rawY * renderH) - yOffset;

          const isLeft = px < (cw / 2);
          const pointColor = isLeft ? "#e74c3c" : "#2ecc71";

          if (isLeft) leftCount++; else rightCount++;

          drawMarkerPoint(px, py, pointColor);
        });
      }

      if (isTimerActive) {
        currentLeftCount = leftCount;
        currentRightCount = rightCount;
        document.getElementById("count-left").innerText = leftCount;
        document.getElementById("count-right").innerText = rightCount;
      }
    }

    function drawMarkerPoint(x, y, color) {
      canvasCtx.fillStyle = color;
      canvasCtx.beginPath();
      canvasCtx.arc(x, y, 26, 0, 2 * Math.PI);
      canvasCtx.fill();
      canvasCtx.strokeStyle = "#ffffff";
      canvasCtx.lineWidth = 4;
      canvasCtx.stroke();
    }

    // 5. Timer & Evaluasi Hasil Per Soal
    function startQuestionTimer() {
      timeLeft = 15;
      isTimerActive = true;
      document.getElementById("timer").innerText = timeLeft;

      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          isTimerActive = false;
          evaluateGroupAnswers();
        }
      }, 1000);
    }

    function evaluateGroupAnswers() {
      const qData = questions[currentQ];
      const correctChoice = qData.a;

      let correctCount = (correctChoice === "BENAR") ? currentRightCount : currentLeftCount;
      let wrongCount = (correctChoice === "BENAR") ? currentLeftCount : currentRightCount;

      rekapData.push({
        no: currentQ + 1,
        soal: qData.q.replace("Pernyataan: ", ""),
        kunci: correctChoice,
        benarCount: correctCount,
        salahCount: wrongCount
      });

      const modalTitle = document.getElementById("modal-title");
      const modalBody = document.getElementById("modal-body");

      modalTitle.innerText = `Jawaban Benar: ${correctChoice}!`;
      modalBody.innerHTML = `
        <p><b>${correctCount} Siswa</b> memilih di zona TEPAT 🎉<br>
        <span style="color:#e74c3c;">${wrongCount} Siswa</span> memilih di zona yang salah.</p>
      `;

      document.getElementById("modal-result").style.display = "flex";
    }

    function showQuestion() {
      document.getElementById("question").innerText = questions[currentQ].q;
      document.getElementById("modal-result").style.display = "none";
      document.getElementById("btn-next").style.display = "inline-block";
      document.getElementById("btn-restart").style.display = "none";
      
      currentLeftCount = 0;
      currentRightCount = 0;
      document.getElementById("count-left").innerText = 0;
      document.getElementById("count-right").innerText = 0;

      startQuestionTimer();
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ < questions.length) {
        showQuestion();
      } else {
        renderFinalSummary();
      }
    }

    // 6. Rekapitulasi Akhir Kuis
    function renderFinalSummary() {
      document.getElementById("modal-title").innerText = "🏆 Rekapitulasi Hasil Kuis Kelompok";
      
      let tableHtml = `
        <p style="font-size:15px; margin-bottom:12px; color:#aaa;">Berikut adalah rekap jumlah partisipasi siswa untuk tiap soal:</p>
        <table class="rekap-table">
          <thead>
            <tr>
              <th style="width: 8%;">No</th>
              <th>Pernyataan Soal</th>
              <th style="width: 15%;">Kunci</th>
              <th style="width: 20%; color:#2ecc71;">Siswa Benar</th>
              <th style="width: 20%; color:#e74c3c;">Siswa Salah</th>
            </tr>
          </thead>
          <tbody>
      `;

      let totalSiswaBenar = 0;
      let totalSiswaSalah = 0;

      rekapData.forEach(item => {
        totalSiswaBenar += item.benarCount;
        totalSiswaSalah += item.salahCount;

        tableHtml += `
          <tr>
            <td style="text-align:center;"><b>${item.no}</b></td>
            <td>${item.soal}</td>
            <td style="text-align:center;"><b>${item.kunci}</b></td>
            <td style="text-align:center; color:#2ecc71; font-weight:bold;">${item.benarCount} Siswa</td>
            <td style="text-align:center; color:#e74c3c; font-weight:bold;">${item.salahCount} Siswa</td>
          </tr>
        `;
      });

      tableHtml += `
          </tbody>
        </table>
        <div style="background:#181818; padding:10px; border-radius:8px; margin-bottom:12px; font-size:15px;">
          <b>Total Akumulasi Jawaban:</b> <span style="color:#2ecc71;">${totalSiswaBenar} Jawaban Tepat</span> | <span style="color:#e74c3c;">${totalSiswaSalah} Jawaban Salah</span>
        </div>
      `;

      document.getElementById("modal-body").innerHTML = tableHtml;
      document.getElementById("btn-next").style.display = "none";
      document.getElementById("btn-restart").style.display = "inline-block";
    }

    function restartQuiz() {
      currentQ = 0;
      rekapData = [];
      showQuestion();
    }
  </script>
</body>
</html>
